<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paddle port · medium</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #12324f; color: #e7f2ff; font: 14px/1.3 ui-sans-serif, system-ui, sans-serif; }
  header { display: flex; justify-content: space-between; padding: 10px 14px; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  canvas { flex: 1; width: 100%; min-height: 0; display: block; background: #0c2238; touch-action: none; }
  footer { display: flex; gap: 8px; padding: 10px; }
  button { flex: 1; border: 0; border-radius: 8px; padding: 8px; background: #7fd0ff; color: #082033; font: inherit; }
</style>
</head>
<body data-effort="medium">
<header>
  <h1>Medium · court</h1>
  <div id="score">0</div>
</header>
<canvas id="game"></canvas>
<footer>
  <button type="button" id="left">Left</button>
  <button type="button" id="right">Right</button>
</footer>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const ball = { x: 0.5, y: 0.35, vx: 0.38, vy: 0.46 };
const paddle = { x: 0.5, w: 0.2 };
let score = 0;
let held = 0;
function fit() {
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const nextW = Math.max(1, Math.floor(width * dpr));
  const nextH = Math.max(1, Math.floor(height * dpr));
  if (canvas.width !== nextW || canvas.height !== nextH) {
    canvas.width = nextW;
    canvas.height = nextH;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  return width >= 2 && height >= 2;
}
document.getElementById("left").addEventListener("pointerdown", () => { held = -1; });
document.getElementById("right").addEventListener("pointerdown", () => { held = 1; });
window.addEventListener("pointerup", () => { held = 0; });
canvas.addEventListener("pointermove", (event) => {
  const rect = canvas.getBoundingClientRect();
  paddle.x = (event.clientX - rect.left) / rect.width;
});
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.032, (now - last) / 1000);
  last = now;
  if (!fit()) {
    requestAnimationFrame(frame);
    return;
  }
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (held) paddle.x += held * dt * 0.75;
  paddle.x = Math.min(1 - paddle.w / 2, Math.max(paddle.w / 2, paddle.x));
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  if (ball.x < 0.03 || ball.x > 0.97) ball.vx *= -1;
  if (ball.y < 0.05) ball.vy = Math.abs(ball.vy);
  if (ball.vy > 0 && ball.y > 0.88 && ball.y < 0.96 && Math.abs(ball.x - paddle.x) < paddle.w / 2) {
    ball.vy = -Math.abs(ball.vy);
    ball.y = 0.87;
    score += 1;
    scoreEl.textContent = String(score);
  }
  if (ball.y > 1.05) { ball.x = 0.5; ball.y = 0.3; ball.vy = 0.46; }
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = "#7fd0ff";
  ctx.fillRect((paddle.x - paddle.w / 2) * width, height * 0.9, paddle.w * width, 10);
  ctx.fillStyle = "#fff";
  ctx.fillRect(ball.x * width - 6, ball.y * height - 6, 12, 12);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
