<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e4d8c4" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="780" fill="#f4efe4"/>
  <rect width="1200" height="780" fill="url(#grid)"/>
  <text x="48" y="64" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="700" fill="#1c1917">RFC-41 · OPEN RISKS</text>
  <text x="48" y="98" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#57534e">Sample whiteboard · hand-authored · not a photograph</text>
  <g>
    <title>Regions are approximate 0-1. Rae, Friday.</title>
    <rect x="60" y="140" width="520" height="220" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
    <text x="88" y="210" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">Regions are approximate</text>
    <text x="88" y="256" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">0-1. Rae, Friday.</text>
  </g>
  <g>
    <title>Open: do repeat photos count as cache hits?</title>
    <rect x="640" y="150" width="480" height="210" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text x="668" y="220" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#78350f">Open: do repeat photos</text>
    <text x="668" y="266" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#78350f">count as cache hits?</text>
  </g>
  <rect x="60" y="430" width="520" height="200" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
  <text x="88" y="500" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#7c2d12">Schema freeze</text>
  <text x="88" y="548" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#1c1917">Nia · Thursday</text>
</svg>
